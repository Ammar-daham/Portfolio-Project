# Checks every pull request, and main after each merge
name: CI

on:
  pull_request:
  push:
    branches: [main]

# The workflow only reads the repository
permissions:
  contents: read

# A newer push to the same PR or branch cancels the run in progress
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Node from .nvmrc. check-latest picks the newest 22.x, as Netlify and
      # `nvm install` do (package.json needs 22.22.2 or newer).
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
