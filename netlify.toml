# Netlify build settings. These override the ones in the Netlify UI.
# The Node.js version comes from .nvmrc.
[build]
  command = "npm run build"
  publish = "dist"

# Vite puts a content hash in every file name under /assets, so a changed
# file always gets a new URL. Browsers can keep these for a year without
# checking back. Everything else keeps Netlify's default (revalidate).
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The site moved to ammardaham.fi. Old links and search results on the
# Netlify address go to the same page there (/fi/, the CV PDF, …).
[[redirects]]
  from = "https://ammardaham.netlify.app/*"
  to = "https://ammardaham.fi/:splat"
  status = 301
  force = true
